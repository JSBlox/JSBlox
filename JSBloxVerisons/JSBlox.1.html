float shadowAmount(vec3 wp,vec3 n){

function createRoundedBox(w,h,d,r,s=2){
r=Math.min(r,w/2-.001,h/2-.001,d/2-.001);
if(r<=.001)return new T.BoxGeometry(w,h,d);
const sx=w/2-r,sy=h/2-r;
const shape=new T.Shape();
shape.moveTo(-sx,-sy+r);
shape.absarc(-sx+r,-sy+r,r,Math.PI,Math.PI*1.5,false);
shape.absarc(sx-r,-sy+r,r,Math.PI*1.5,0,false);
shape.absarc(sx-r,sy-r,r,0,Math.PI*.5,false);
shape.absarc(-sx+r,sy-r,r,Math.PI*.5,Math.PI,false);

const geo=new T.ExtrudeGeometry(shape,extrudeSettings);
geo.center();
return geo;}
